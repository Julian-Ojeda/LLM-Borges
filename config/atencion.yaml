# ==============================================================================
# CBOW CON AUTO-ATENCIÓN (scripts/entrenar_atencion_cupy.py)
# Parte de un CBOW ya entrenado (solo lectura) y escribe todo en una carpeta aparte.
# Para deshacerlo, alcanza con borrar directorio_respaldos.
# ==============================================================================

# Corpus (el mismo con el que se construyó el vocabulario del respaldo)
ruta_corpus: datos/corpus_ApAvAu.txt

# CBOW de partida: el ajuste sin signos como objetivo (época 289). No se modifica
ruta_checkpoint: respaldos/ajuste_puntuacion/modelo_cbow_w4_ajuste_epoca_289.npz

# Carpeta de salida: distinta de la del respaldo de partida y sin métricas previas
directorio_respaldos: respaldos/atencion

# Debe coincidir con el del respaldo de partida
tamanio_ventana: 4

# Cabezas de atención; la dimensión del embedding (80) tiene que ser múltiplo (1, 2, 4, 5, 8, 10, ...)
cantidad_cabezas: 1

# Muestras por paso de Adam
tamanio_lote: 256

# Tasas de Adam por grupo de parámetros. 0 = congelado
tasa_atencion: 0.001     # x_centro, P, Wq, Wk, Wv, Wo, clave nula
tasa_salida: 0.0001      # W'
tasa_embeddings: 0.0     # W (los embeddings del CBOW quedan fijos)

# La tasa baja linealmente hasta 0 a lo largo de todo el entrenamiento (como en microgpt.py)
decaimiento_lineal: true

# Igual que en el ajuste: los signos están en el contexto pero no son palabra central
excluir_signos_objetivo: true

# true = control: la atención queda fija en el promedio del contexto (CBOW) y solo se entrena W'
congelar_atencion: false

cantidad_epocas: 10

# Respaldo cada tantas épocas (y siempre la última); cada .npz ocupa ~31 MB
frecuencia_respaldo: 2

semilla_aleatoria: 26

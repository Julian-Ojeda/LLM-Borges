<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Lenguaje - TP2</title>
<meta name="description" content="Aprendizaje automático avanzado - Construcción de un Modelo de Lenguaje (TP2)">
<style>
  :root {
    --fondo: #1f2a30;
    --barra: rgba(20, 28, 32, 0.92);
    --texto: #e8eef1;
    --tenue: #9fb0b8;
    --acento: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #escenario { position: fixed; inset: 0 0 48px 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  #diapo { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain;
    filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.45)); }
  body.completa #escenario { inset: 0; padding: 0; }
  body.completa #diapo { filter: none; }
  body.completa #barra { opacity: 0; }
  body.completa #barra:hover { opacity: 1; }
  #barra { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center;
    gap: 8px; padding: 0 12px; background: var(--barra); transition: opacity 0.2s; }
  #barra button { background: transparent; color: var(--texto); border: 1px solid #4a5a62; border-radius: 6px;
    height: 32px; min-width: 40px; padding: 0 10px; font: inherit; font-size: 14px; cursor: pointer; }
  #barra button:hover { border-color: var(--acento); }
  #barra button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  #contador { font-size: 14px; color: var(--tenue); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #titulo { flex: 1; font-size: 14px; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #notas { position: fixed; left: 0; right: 0; bottom: 48px; max-height: 40vh; overflow-y: auto; padding: 14px 18px;
    background: var(--barra); border-top: 1px solid #4a5a62; font-size: 15px; line-height: 1.5; white-space: pre-wrap; display: none; }
  body.con-notas #notas { display: block; }
  body.con-notas #escenario { bottom: calc(48px + 40vh); }
  #ayuda { color: var(--tenue); font-size: 12px; }
  @media (max-width: 600px) {
    #titulo, #ayuda, #btn-completa { display: none; }
    #barra { justify-content: center; }
  }
</style>
</head>
<body>
<div id="escenario" role="region" aria-label="Diapositiva">
  <img id="diapo" src="slides/01.png" alt="Aprendizaje automático avanzado">
</div>
<div id="notas" aria-live="polite"></div>
<div id="barra">
  <button id="ant" type="button" aria-label="Diapositiva anterior">&larr;</button>
  <span id="contador">1 / 1</span>
  <button id="sig" type="button" aria-label="Diapositiva siguiente">&rarr;</button>
  <span id="titulo"></span>
  <span id="ayuda">&larr; &rarr; avanzar · F pantalla completa · N notas</span>
  <button id="btn-notas" type="button" aria-pressed="false">Notas</button>
  <button id="btn-completa" type="button">Pantalla completa</button>
</div>
<script>
const DIAPOS = [{"img": "slides/01.png", "titulo": "Aprendizaje automático avanzado", "notas": "Buenas tardes, en este segundo trabajo práctico abordamos la transición desde las representaciones contextuales continuas aprendidas en el TP1 hacia la construcción de modelos de lenguaje, explorando tanto arquitecturas perceptrón multicapa como arquitecturas basadas en transformadores (microgtp de Karpathy)."}, {"img": "slides/02.png", "titulo": "Objetivo y enfoques", "notas": "El punto de partida son las representaciones contextuales obtenidas en el TP1. El desafío consiste en alimentar secuencias temporales hacia un PMC y compararlo frente a un Transformer."}, {"img": "slides/03.png", "titulo": "PMC como Modelo de Lenguaje", "notas": ""}, {"img": "slides/04.png", "titulo": "PMC como Modelo de Lenguaje", "notas": "Entrada por Concatenación Causal: Se toma una ventana de contexto de k palabras previas (entre 5 y 10 tokens) y se concatenan sus vectores para formar una única entrada continua de dimensión kd (ej. 550=250 o 1050=500 componentes)."}, {"img": "slides/05.png", "titulo": "Entrada y PMC (PyTorch)", "notas": "Carga de la Matriz:\nLa matriz W del TP1 (53.40850) se carga en memoria como un tensor estático: W = torch.from_numpy(W_tp1).to(dispositivo)\nMapeo del Contexto:\nSi la frase previa es [\"los\", \"enanos\", \"tienen\", \"una\", \"especie\"] (k=5), se buscan sus IDs en el diccionario del TP1: indices = [idx_los, idx_enanos, idx_tienen, idx_una, idx_especie]\nIndexación y Concatenación (Aplanado):\nEn lugar de hacer bucles lentos en Python con np.concatenate, indexamos el tensor: W[indices] extrae directamente las 5 filas correspondientes, formando una matriz de [5,50].\nAl aplicar .view(-1) (o .view(batch, -1) en lotes), se aplana en un único vector continuo de 250 componentes (550=250).\nEste vector continuo es el que ingresa directamente a la primera capa densa del PMC."}, {"img": "slides/06.png", "titulo": "PMC como Modelo de Lenguaje", "notas": "Opción A (Regresión Vectorial en $\\mathbb{R}^d$): El modelo intenta predecir las 50 componentes numéricas del vector de la siguiente palabra.\nOpción B (Clasificación Multiclase sobre |V|): El modelo predice un puntaje (logit) para cada una de las 53.408 palabras posibles y genera una distribución de probabilidad."}, {"img": "slides/07.png", "titulo": "Código", "notas": ""}, {"img": "slides/08.png", "titulo": "Modelos entrenados", "notas": ""}, {"img": "slides/09.png", "titulo": "Modelos entrenados (d=80)", "notas": "Entrené 4 PMC. Dos predicen el vector de la palabra siguiente (con tanh o con logística a la salida) y dos predicen directamente qué palabra del vocabulario sigue (softmax). Probé dos formas de entrenar: Adam con lotes de 256 ejemplos y SGD de a un ejemplo."}, {"img": "slides/10.png", "titulo": "Curvas de pérdida", "notas": ""}, {"img": "slides/11.png", "titulo": "Curvas de pérdida", "notas": ""}, {"img": "slides/12.png", "titulo": "Curvas de pérdida (vocabulario, d=80)", "notas": "Línea punteada: error sobre los datos de entrenamiento. Línea llena: error sobre datos que el modelo no vio (el último 5% del corpus). Con Adam el error de entrenamiento baja pero el de validación sube: el modelo memoriza en vez de generalizar (sobreajuste). SGD de a un ejemplo, en 2 épocas, logró el menor error de validación."}, {"img": "slides/13.png", "titulo": "Top 5 predicciones (K=10, H=100-100, L=64, LayerNorm) - vector", "notas": ""}, {"img": "slides/14.png", "titulo": "Generación continua (K=10, H=100-100, L=64, LayerNorm) - vector", "notas": ""}, {"img": "slides/15.png", "titulo": "Top 5 predicciones (K=5, H=1000, L=1) - vector", "notas": ""}, {"img": "slides/16.png", "titulo": "Generación continua (K=5, H=1000, L=1) - vector", "notas": ""}, {"img": "slides/17.png", "titulo": "Top 5 predicciones (K=8, H=512, L=256, LayerNorm) - vector", "notas": "Para cada frase, las 5 palabras cuyo vector se parece más al que predijo el modelo. Con tanh aparecen palabras razonables (puerta, ventana, calle). Con logística salen palabras sin sentido."}, {"img": "slides/18.png", "titulo": "Generación continua (K=8, H=512, L=256, LayerNorm) - vector", "notas": "Generación: el modelo predice una palabra, la agrega a la frase y repite. Con logística se queda repitiendo comas y 'ahora'."}, {"img": "slides/19.png", "titulo": "Top 5 predicciones (K=5, H=512, L=64, LayerNorm) - vocabulario", "notas": ""}, {"img": "slides/20.png", "titulo": "Generación continua (K=5, H=512, L=64, LayerNorm) - vocabulario", "notas": ""}, {"img": "slides/21.png", "titulo": "Top 5 predicciones (K=5, H=512, L=1) - vocabulario", "notas": ""}, {"img": "slides/22.png", "titulo": "Generación continua (K=5, H=512, L=1) - vocabulario", "notas": ""}, {"img": "slides/23.png", "titulo": "Top 5 predicciones (K=5, H=200, L=1) - vocabulario", "notas": ""}, {"img": "slides/24.png", "titulo": "Generación continua (K=5, H=200, L=1) - vocabulario", "notas": ""}, {"img": "slides/25.png", "titulo": "Top 5 predicciones (K=8, H=512, LayerNorm) - vocabulario", "notas": "Las 5 palabras más probables según la softmax. Las dos formas de entrenar predicen palabras parecidas."}, {"img": "slides/26.png", "titulo": "Generación continua (K=8, H=512, LayerNorm) - vocabulario", "notas": "Con softmax las frases generadas tienen más sentido que con la salida vector."}, {"img": "slides/27.png", "titulo": "microgpt", "notas": ""}, {"img": "slides/28.png", "titulo": "Adaptación microgpt", "notas": ""}, {"img": "slides/29.png", "titulo": "Código", "notas": ""}, {"img": "slides/30.png", "titulo": "Código", "notas": ""}, {"img": "slides/31.png", "titulo": "Curvas de pérdida", "notas": ""}, {"img": "slides/32.png", "titulo": "Curvas de pérdida", "notas": ""}, {"img": "slides/33.png", "titulo": "Top 5 predicciones (microgpt)", "notas": ""}, {"img": "slides/34.png", "titulo": "Generación continua (microgpt)", "notas": ""}, {"img": "slides/35.png", "titulo": "Algunas pruebas (microgpt)", "notas": ""}, {"img": "slides/36.png", "titulo": "Algunas pruebas (pmc)", "notas": ""}, {"img": "slides/37.png", "titulo": "Algunas pruebas (pmc vocabulario, L=1)", "notas": "Lo mismo con el PMC: en orden predice 'de'; al revés, 'ojos'."}, {"img": "slides/38.png", "titulo": "Algunas pruebas (microgpt temp = 0.0)", "notas": ""}, {"img": "slides/39.png", "titulo": "Algunas pruebas (microgpt temp = 0.5)", "notas": ""}, {"img": "slides/40.png", "titulo": "Algunas pruebas (microgpt temp = 1.2)", "notas": ""}, {"img": "slides/41.png", "titulo": "Algunas pruebas (microgpt temp = 1.2 - 2da pasada)", "notas": ""}, {"img": "slides/42.png", "titulo": "Conclusiones", "notas": ""}, {"img": "slides/43.png", "titulo": "Muchas gracias", "notas": ""}];
const img = document.getElementById("diapo");
const contador = document.getElementById("contador");
const titulo = document.getElementById("titulo");
const notas = document.getElementById("notas");
const btnNotas = document.getElementById("btn-notas");
let actual = 0;

function precargar(i) {
  if (i >= 0 && i < DIAPOS.length) { const p = new Image(); p.src = DIAPOS[i].img; }
}
function ir(i) {
  actual = Math.max(0, Math.min(DIAPOS.length - 1, i));
  const d = DIAPOS[actual];
  img.src = d.img;
  img.alt = d.titulo || ("Diapositiva " + (actual + 1));
  contador.textContent = (actual + 1) + " / " + DIAPOS.length;
  titulo.textContent = d.titulo;
  notas.textContent = d.notas || "(Sin notas en esta diapositiva)";
  if (location.hash !== "#" + (actual + 1)) history.replaceState(null, "", "#" + (actual + 1));
  precargar(actual + 1); precargar(actual - 1);
}
function alternarNotas() {
  const on = document.body.classList.toggle("con-notas");
  btnNotas.setAttribute("aria-pressed", on ? "true" : "false");
}
function alternarCompleta() {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
document.addEventListener("fullscreenchange", () => document.body.classList.toggle("completa", !!document.fullscreenElement));

document.getElementById("ant").addEventListener("click", () => ir(actual - 1));
document.getElementById("sig").addEventListener("click", () => ir(actual + 1));
btnNotas.addEventListener("click", alternarNotas);
document.getElementById("btn-completa").addEventListener("click", alternarCompleta);
document.getElementById("escenario").addEventListener("click", (e) => {
  const mitad = window.innerWidth / 2;
  ir(e.clientX < mitad * 0.6 ? actual - 1 : actual + 1);
});
document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); ir(actual + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); ir(actual - 1); }
  else if (k === "Home") ir(0);
  else if (k === "End") ir(DIAPOS.length - 1);
  else if (k === "f" || k === "F") alternarCompleta();
  else if (k === "n" || k === "N") alternarNotas();
});
let x0 = null;
document.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) ir(dx < 0 ? actual + 1 : actual - 1);
  x0 = null;
}, { passive: true });
window.addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (!isNaN(n) && n - 1 !== actual) ir(n - 1);
});

const inicio = parseInt(location.hash.slice(1), 10);
ir(isNaN(inicio) ? 0 : inicio - 1);
</script>
</body>
</html>
